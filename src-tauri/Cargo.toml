[package]
name = "osu-player"
version = "0.3.1"
description = "A lightweight osu! music player"
authors = ["Shin Aki"]
license = "MIT"
repository = "https://github.com/ShjnAki/osu-music_player"
edition = "2021"

[lib]
name = "osu_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
id3 = "1"
# Déjà compilé pour Tauri : décode les chemins dans les URL du serveur média.
percent-encoding = "2"
# Déjà compilé pour Tauri : encode le script PowerShell de l'épingle sous WSL.
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
